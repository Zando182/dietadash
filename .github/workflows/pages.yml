name: Deploy su GitHub Pages

# Pubblica la dashboard a ogni push su main. Online non c'e' il server Python,
# quindi la pagina gira in sola lettura sull'istantanea web/dati.json: se quel
# file non e' nel repository, il sito si apre e spiega come installarla.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Un deploy alla volta, senza annullare quello in corso.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Niente build: la dashboard e' HTML, CSS e JavaScript semplice.
      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web

      - id: deploy
        uses: actions/deploy-pages@v4
