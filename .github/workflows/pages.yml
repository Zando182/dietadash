name: Deploy su GitHub Pages

# Pubblica la dashboard a ogni push su main. Online non c'e' il server Python,
# quindi la pagina gira in sola lettura sull'istantanea web/dati.json: se quel
# file non e' nel repository, il sito si apre e spiega come installarla.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Un deploy alla volta, senza annullare quello in corso.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Niente build, ma le risorse vanno timbrate: Pages le serve con
      # max-age=600, quindi senza un indirizzo nuovo il browser continuerebbe
      # a usare la versione di prima per dieci minuti dopo ogni deploy.
      - name: Timbra la versione sulle risorse
        run: |
          V="${GITHUB_SHA::8}"
          sed -i \
            -e "s|content=\"sviluppo\"|content=\"$V\"|" \
            -e "s|href=\"style.css\"|href=\"style.css?v=$V\"|" \
            -e "s|src=\"app.js\"|src=\"app.js?v=$V\"|" \
            web/index.html
          grep -q "app.js?v=$V" web/index.html || { echo "Timbro non applicato"; exit 1; }
          echo "Versione pubblicata: $V"

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web

      - id: deploy
        uses: actions/deploy-pages@v4
